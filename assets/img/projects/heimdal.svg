<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 880" width="1280" height="880">
  <!-- Heimdal — a watch beam fanning out from a sensor, hosts lit where it
       reaches them, one finding locked under a reticle. Palette: variables.css. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1407"/>
      <stop offset=".55" stop-color="#060b05"/>
      <stop offset="1" stop-color="#050804"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#55F23E" stop-opacity=".30"/>
      <stop offset=".55" stop-color="#55F23E" stop-opacity=".07"/>
      <stop offset="1" stop-color="#55F23E" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#55F23E" stop-opacity=".16"/>
      <stop offset=".45" stop-color="#55F23E" stop-opacity=".05"/>
      <stop offset="1" stop-color="#55F23E" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0v40" fill="none" stroke="#F4F4F0" stroke-opacity=".045"/>
    </pattern>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <filter id="wide" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1280" height="880" fill="url(#bg)"/>
  <rect width="1280" height="880" fill="url(#grid)"/>
  <ellipse cx="470" cy="470" rx="520" ry="400" fill="url(#glow)"/>
  <ellipse cx="905" cy="450" rx="215" ry="195" fill="url(#glow)"/>

  <!-- The beam, and the two edges that give it a direction -->
  <path d="M215 470 1137 153A975 975 0 0 1 1137 787Z" fill="url(#beam)" filter="url(#wide)"/>
  <g fill="none" stroke="#55F23E" stroke-opacity=".20" stroke-width="2">
    <path d="M215 470 1137 153"/>
    <path d="M215 470 1137 787"/>
  </g>

  <!-- Sweep arcs, all struck from the sensor -->
  <g fill="none" stroke="#55F23E" stroke-width="2">
    <path d="M483 388A280 280 0 0 1 483 552" stroke-opacity=".28"/>
    <path d="M645 338A450 450 0 0 1 645 602" stroke-opacity=".22"/>
    <path d="M808 289A620 620 0 0 1 808 651" stroke-opacity=".16"/>
    <path d="M971 239A790 790 0 0 1 971 701" stroke-opacity=".11"/>
    <path d="M1137 153A975 975 0 0 1 1137 787" stroke-opacity=".13"/>
  </g>

  <!-- Mast rail the sensor is mounted on -->
  <g fill="none" stroke="#55F23E" stroke-width="2">
    <path d="M64 200v480" stroke-opacity=".16"/>
    <path d="M64 260h14"/><path d="M64 340h14"/><path d="M64 420h14"/>
    <path d="M64 500h14"/><path d="M64 580h14"/><path d="M64 660h14"/>
    <path d="M78 470h53" stroke-opacity=".28"/>
  </g>

  <!-- The sensor -->
  <g fill="none" stroke="#55F23E" stroke-width="2">
    <circle cx="215" cy="470" r="34" stroke-opacity=".55"/>
    <circle cx="215" cy="470" r="58" stroke-opacity=".30"/>
    <circle cx="215" cy="470" r="84" stroke-opacity=".16"/>
    <g stroke-opacity=".34">
      <path d="M305 470h12"/><path d="M279 534 287 542"/><path d="M215 560v12"/>
      <path d="M151 534 143 542"/><path d="M151 406 143 398"/>
      <path d="M215 380v-12"/><path d="M279 406 287 398"/>
    </g>
  </g>
  <circle cx="215" cy="470" r="18" fill="#55F23E" filter="url(#soft)"/>
  <circle cx="215" cy="470" r="9" fill="#55F23E"/>

  <!-- Hosts the beam reaches -->
  <g fill="#55F23E" fill-opacity=".42">
    <circle cx="470" cy="470" r="6"/><circle cx="560" cy="410" r="5"/>
    <circle cx="600" cy="540" r="6"/><circle cx="690" cy="380" r="5"/>
    <circle cx="730" cy="470" r="6"/><circle cx="770" cy="600" r="5"/>
    <circle cx="840" cy="520" r="6"/><circle cx="880" cy="392" r="5"/>
    <circle cx="1000" cy="332" r="5"/><circle cx="1030" cy="600" r="6"/>
    <circle cx="1090" cy="470" r="5"/><circle cx="950" cy="662" r="5"/>
  </g>

  <!-- Hosts outside its arc -->
  <g fill="#55F23E" fill-opacity=".16">
    <circle cx="400" cy="200" r="5"/><circle cx="330" cy="700" r="5"/>
    <circle cx="560" cy="770" r="5"/><circle cx="760" cy="170" r="5"/>
    <circle cx="1010" cy="110" r="5"/><circle cx="1100" cy="800" r="5"/>
  </g>

  <!-- Two flagged for a closer look -->
  <g fill="none" stroke="#55F23E" stroke-opacity=".55" stroke-width="2" stroke-dasharray="6 8">
    <circle cx="560" cy="410" r="17"/>
    <circle cx="1030" cy="600" r="17"/>
  </g>

  <!-- The finding, locked -->
  <circle cx="905" cy="450" r="16" fill="#55F23E" filter="url(#soft)"/>
  <circle cx="905" cy="450" r="8" fill="#55F23E"/>
  <g fill="none" stroke="#55F23E" stroke-width="3" stroke-opacity=".9">
    <path d="M861 428v-22h22"/><path d="M949 428v-22h-22"/>
    <path d="M861 472v22h22"/><path d="M949 472v22h-22"/>
  </g>
  <g fill="none" stroke="#55F23E" stroke-width="2" stroke-opacity=".5">
    <path d="M905 384v-18"/><path d="M905 516v18"/>
    <path d="M839 450h-18"/><path d="M971 450h18"/>
  </g>
  <circle cx="905" cy="450" r="60" fill="none" stroke="#55F23E" stroke-opacity=".22"
    stroke-width="2" stroke-dasharray="4 10"/>

  <g fill="none" stroke="#55F23E" stroke-opacity=".45" stroke-width="3">
    <path d="M56 100V56h44"/>
    <path d="M1224 780v44h-44"/>
  </g>
</svg>
