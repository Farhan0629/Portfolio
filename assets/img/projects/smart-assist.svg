<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 880" width="1280" height="880">
  <!-- Smart Assist Web — a spoken command read off a level meter, carried out
       to three devices, one of them acting. Palette matches variables.css. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1407"/>
      <stop offset=".55" stop-color="#060b05"/>
      <stop offset="1" stop-color="#050804"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#55F23E" stop-opacity=".30"/>
      <stop offset=".55" stop-color="#55F23E" stop-opacity=".07"/>
      <stop offset="1" stop-color="#55F23E" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0v40" fill="none" stroke="#F4F4F0" stroke-opacity=".045"/>
    </pattern>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>

  <rect width="1280" height="880" fill="url(#bg)"/>
  <rect width="1280" height="880" fill="url(#grid)"/>
  <ellipse cx="380" cy="490" rx="440" ry="410" fill="url(#glow)"/>
  <ellipse cx="1120" cy="470" rx="205" ry="195" fill="url(#glow)"/>

  <path d="M92 470h436" stroke="#55F23E" stroke-opacity=".18" stroke-width="2"/>

  <!-- Voice level -->
  <rect x="304" y="270" width="14" height="400" rx="7" fill="#55F23E" filter="url(#soft)"/>
  <g fill="#55F23E">
    <rect x="100" y="435" width="14" height="70" rx="7" fill-opacity=".28"/>
    <rect x="134" y="400" width="14" height="140" rx="7" fill-opacity=".38"/>
    <rect x="168" y="365" width="14" height="210" rx="7" fill-opacity=".50"/>
    <rect x="202" y="305" width="14" height="330" rx="7" fill-opacity=".75"/>
    <rect x="236" y="385" width="14" height="170" rx="7" fill-opacity=".42"/>
    <rect x="270" y="340" width="14" height="260" rx="7" fill-opacity=".60"/>
    <rect x="304" y="270" width="14" height="400" rx="7" fill-opacity=".95"/>
    <rect x="338" y="350" width="14" height="240" rx="7" fill-opacity=".55"/>
    <rect x="372" y="395" width="14" height="150" rx="7" fill-opacity=".40"/>
    <rect x="406" y="330" width="14" height="280" rx="7" fill-opacity=".65"/>
    <rect x="440" y="375" width="14" height="190" rx="7" fill-opacity=".45"/>
    <rect x="474" y="420" width="14" height="100" rx="7" fill-opacity=".32"/>
    <rect x="508" y="440" width="14" height="60" rx="7" fill-opacity=".25"/>
  </g>

  <!-- The command travelling outward -->
  <g fill="none" stroke="#55F23E">
    <path d="M527 269A300 300 0 0 1 527 671" stroke-opacity=".34" stroke-width="2.5"/>
    <path d="M661 230A430 430 0 0 1 661 710" stroke-opacity=".24" stroke-width="2.5"/>
    <path d="M798 207A560 560 0 0 1 798 733" stroke-opacity=".15" stroke-width="2"/>
    <path d="M939 200A690 690 0 0 1 939 740" stroke-opacity=".10" stroke-width="2" stroke-dasharray="7 11"/>
  </g>

  <!-- Devices on the bus -->
  <path d="M1055 290 1125 470 1055 650" fill="none"
    stroke="#55F23E" stroke-opacity=".18" stroke-width="2"/>
  <g fill="none" stroke="#55F23E" stroke-width="2">
    <circle cx="1055" cy="290" r="44" stroke-opacity=".30"/>
    <circle cx="1055" cy="650" r="44" stroke-opacity=".30"/>
  </g>
  <g fill="#55F23E" fill-opacity=".28">
    <circle cx="1055" cy="290" r="10"/><circle cx="1055" cy="650" r="10"/>
  </g>
  <circle cx="1125" cy="470" r="52" fill="#55F23E" fill-opacity=".12"
    stroke="#55F23E" stroke-opacity=".9" stroke-width="2.5"/>
  <circle cx="1125" cy="470" r="72" fill="none" stroke="#55F23E" stroke-opacity=".22"
    stroke-width="2" stroke-dasharray="4 10"/>
  <circle cx="1125" cy="470" r="20" fill="#55F23E" filter="url(#soft)"/>
  <circle cx="1125" cy="470" r="11" fill="#55F23E"/>

  <!-- The wavefront handed off to each device -->
  <g stroke="#55F23E" stroke-width="2">
    <path d="M974 290h37" stroke-opacity=".35"/>
    <path d="M974 650h37" stroke-opacity=".35"/>
    <path d="M996 470h77" stroke-opacity=".75" stroke-width="2.5"/>
  </g>

  <g fill="none" stroke="#55F23E" stroke-opacity=".45" stroke-width="3">
    <path d="M56 100V56h44"/>
    <path d="M1224 780v44h-44"/>
  </g>
</svg>
